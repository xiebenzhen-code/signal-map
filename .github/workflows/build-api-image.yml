name: Build API image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run build
      - run: npm run api:build

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"'
      - name: Prepare image address
        id: address
        env:
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          SOURCE_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          printf 'image=ccr.ccs.tencentyun.com/%s/signal-map-api:%s\n' "$TCR_NAMESPACE" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build and push fixed-source image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.address.outputs.image }}
      - name: Record image identity
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          IMAGE: ${{ steps.address.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          test -n "$DIGEST"
          printf '## API image\n\nCommit: `%s`\n\nImage: `%s`\n\nDigest: `%s`\n' "$SOURCE_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
